[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosec-verifiable-rag"
version = "0.3.0"
description = "A source-grounded RAG evaluation framework evolving toward verifiable Agentic RAG for cryptography and security literature."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Valerie Luo" }]
keywords = [
  "retrieval-augmented-generation",
  "agentic-rag",
  "cryptography",
  "security",
  "information-retrieval",
  "llm-evaluation",
]
dependencies = [
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "pdfplumber>=0.11.0",
  "pypdf>=4.0.0",
  "scikit-learn>=1.4.0",
  "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
ui = ["streamlit>=1.36.0"]

[project.urls]
Repository = "https://github.com/ValerieLuo2003/rag-local"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
